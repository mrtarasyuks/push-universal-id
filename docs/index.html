<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Push Universal ID</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="theme-color" content="#0d0b14" />
    <meta id="meta-description" name="description" content="" />
    <script type="module" crossorigin src="./assets/index-DXMirUAB.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BlCUzUQN.css">
  </head>
  <body>
    <main class="wrap">
      <div class="top-bar">
        <div class="logo" id="logo"></div>
        <div class="lang-switch" id="lang-switch" role="group" aria-label="Language"></div>
      </div>

      <header class="hero">
        <h1 id="hero-title"></h1>
        <p class="lede" id="hero-lede"></p>
      </header>

      <form id="lookup-form" class="lookup" autocomplete="off">
        <div class="network-select" id="network-select">
          <button type="button" class="network-trigger" id="network-trigger" aria-haspopup="listbox" aria-expanded="false">
            <span class="network-icon" id="network-icon"></span>
            <span class="network-label" id="network-label"></span>
            <span class="network-arrow" aria-hidden="true">▾</span>
          </button>
          <ul class="network-list" id="network-list" role="listbox" hidden></ul>
        </div>
        <select id="chain" hidden aria-hidden="true" tabindex="-1"></select>

        <div class="search-row">
          <input id="address" type="text" spellcheck="false" />
          <button type="submit" class="bubble-btn" id="bubble-btn">
            <span class="bubble-glow" aria-hidden="true"></span>
            <span class="bubble-icon" aria-hidden="true">🔍</span>
          </button>
        </div>
      </form>

      <p id="status" class="status" hidden></p>
      <div id="flash" class="flash" aria-hidden="true"></div>
      <section id="result" class="result"></section>

      <footer class="foot">
        <p id="footer-text"></p>
      </footer>
    </main>

  </body>
</html>
